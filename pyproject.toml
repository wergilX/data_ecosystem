[project]
name = "data_transformer"
version = "0.1.0"
description = "A two-phase system for generating complex nested data and ingesting it into flattened, AI-ready JSONL streams"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "faker>=40.4.0",
    "flatten-json>=0.1.14",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=1.19.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.0",
    "ty>=0.0.15",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
