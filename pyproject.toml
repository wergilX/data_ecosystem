[project]
name = "automotive-data-ecosystem"
version = "0.1.0"
description = "A two-phase system for generating complex nested automotive data and ingesting it into flattened, AI-ready JSONL streams"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "faker>=40.4.0",
    "logging>=0.4.9.6",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "ty>=0.0.15",
]
